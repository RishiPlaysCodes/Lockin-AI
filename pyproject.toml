[project]
name = "focus-guardian-ai"
version = "1.0.0"
description = "Enterprise-grade focus & study session tracking with AI-powered coaching"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",  # assert used (ok in tests)
    "S106",  # hardcoded password (ok in tests)
    "B008",  # function call in default arg (DRF pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"src/*/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "focus_guardian"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "focus_guardian.settings.development"

[tool.coverage.run]
source = ["core"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
