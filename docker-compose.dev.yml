# ============================================================
# Focus Guardian AI - Docker Compose (Development)
# Usage: docker compose -f docker-compose.dev.yml up
# ============================================================

services:
  web:
    build:
      context: .
      target: production
    container_name: focus_guardian_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=focus_guardian.settings.development
      - DJANGO_DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app
    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:16-alpine
    container_name: focus_guardian_dev_db
    environment:
      POSTGRES_DB: focus_guardian
      POSTGRES_USER: focus_guardian
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus_guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: focus_guardian_dev_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dev_postgres_data:
