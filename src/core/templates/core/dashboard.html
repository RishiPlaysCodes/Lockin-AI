{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Focus Guardian AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
</head>
<body>
    <div class="app-shell">
        <nav class="navbar">
            <a href="/dashboard/" class="brand">
                <span class="brand-logo">&#9673;</span>
                Focus Guardian AI
            </a>
            <div class="nav-right">
                <span class="nav-user" id="nav-user"></span>
                <button class="btn btn-ghost" id="logout-btn" type="button">Logout</button>
            </div>
        </nav>

        <main class="container-app">
            <h1 class="page-title">Welcome back<span id="welcome-name"></span></h1>
            <p class="page-subtitle">Here's an overview of your focus performance.</p>

            <!-- Stats -->
            <div class="stat-grid" id="stat-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--primary-soft); color: #a5b4fc;">&#9889;</div>
                    <div class="stat-label">Focus Score</div>
                    <div class="stat-value" id="stat-focus">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--success-soft); color: #86efac;">&#8987;</div>
                    <div class="stat-label">Total Study Time</div>
                    <div class="stat-value" id="stat-time">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--warning-soft); color: #fcd34d;">&#128293;</div>
                    <div class="stat-label">Streak</div>
                    <div class="stat-value" id="stat-streak">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(56,189,248,0.14); color: #7dd3fc;">&#127919;</div>
                    <div class="stat-label">Sessions</div>
                    <div class="stat-value" id="stat-sessions">&mdash;</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="grid-2 mb-4">
                <a href="/timer/" class="btn btn-primary btn-lg">&#9654;&nbsp; Start Focus Session</a>
                <a href="/chat/" class="btn btn-ghost btn-lg">&#129302;&nbsp; Talk to AI Teacher</a>
            </div>

            <!-- Recent sessions -->
            <div class="card">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="section-title" style="margin:0;">Recent Sessions</h2>
                    <span class="text-muted" id="avg-distractions" style="font-size:0.85rem;"></span>
                </div>
                <div id="sessions-container">
                    <div class="spinner spinner-lg"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="{% static 'core/js/app.js' %}"></script>
    <script>
        if (!FG.Auth.requireAuth()) { /* redirected */ }

        document.getElementById("logout-btn").addEventListener("click", () => FG.Auth.logout());

        function fmtDate(iso) {
            try {
                return new Date(iso).toLocaleString(undefined, {
                    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
                });
            } catch (_) { return iso; }
        }

        async function loadProfile() {
            const res = await FG.apiFetch("/profile/");
            if (res.ok && res.data) {
                const name = res.data.username || "";
                document.getElementById("nav-user").textContent = name;
                document.getElementById("welcome-name").textContent = name ? ", " + name : "";
                document.getElementById("stat-focus").textContent = res.data.focus_score;
                document.getElementById("stat-time").textContent = res.data.total_study_time_formatted || "0h 0m";
                document.getElementById("stat-streak").textContent = (res.data.streak_days || 0) + "d";
            }
        }

        async function loadStats() {
            const res = await FG.apiFetch("/reports/stats/");
            if (res.ok && res.data) {
                document.getElementById("stat-sessions").textContent = res.data.total_sessions ?? 0;
                const avg = res.data.avg_distractions_per_session;
                if (avg != null) {
                    document.getElementById("avg-distractions").textContent = "Avg " + avg + " distractions/session";
                }
            }
        }

        async function loadSessions() {
            const container = document.getElementById("sessions-container");
            const res = await FG.apiFetch("/reports/study/");
            if (!res.ok) {
                container.innerHTML = '<div class="empty-state"><div class="icon">&#9888;</div>Could not load sessions.</div>';
                return;
            }
            const sessions = res.data || [];
            if (!sessions.length) {
                container.innerHTML = '<div class="empty-state"><div class="icon">&#128218;</div>No sessions yet. Start your first focus session!</div>';
                return;
            }
            const list = document.createElement("div");
            list.className = "session-list";
            sessions.forEach((s) => {
                const item = document.createElement("div");
                item.className = "session-item";
                const meta = document.createElement("div");
                meta.className = "session-meta";
                const date = document.createElement("span");
                date.className = "session-date";
                date.textContent = fmtDate(s.start_time);
                const type = document.createElement("span");
                type.className = "session-type";
                type.textContent = s.session_type || "session";
                meta.appendChild(date); meta.appendChild(type);

                const badges = document.createElement("div");
                badges.className = "flex gap-2";
                const dur = document.createElement("span");
                dur.className = "badge badge-primary";
                dur.textContent = s.duration || "-";
                const dist = document.createElement("span");
                dist.className = "badge badge-warning";
                dist.textContent = (s.distractions_count ?? 0) + " distractions";
                badges.appendChild(dur); badges.appendChild(dist);

                item.appendChild(meta); item.appendChild(badges);
                list.appendChild(item);
            });
            container.innerHTML = "";
            container.appendChild(list);
        }

        loadProfile();
        loadStats();
        loadSessions();
    </script>
</body>
</html>
