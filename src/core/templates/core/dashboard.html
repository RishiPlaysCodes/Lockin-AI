<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Guardian AI - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1WiQDTl9EI0FGFmPicF/X6s4nkjZPE" crossorigin="anonymous">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-top: 20px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Focus Guardian AI</a>
            <div>
                <span class="navbar-text me-3" id="username-display"></span>
                <button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Focus Score</h6>
                        <div class="stat-value" id="focus-score">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Total Study Time</h6>
                        <div class="stat-value" id="total-study-time">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Streak</h6>
                        <div class="stat-value" id="streak-days">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="/timer/" class="btn btn-primary btn-lg w-100 mt-2">Start Focus Session</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12 text-center">
                <a href="/chat/" class="btn btn-secondary">Talk to AI Teacher</a>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <h3>Recent Study Sessions</h3>
                <ul class="list-group" id="sessions-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        function getAuthHeaders() {
            const token = localStorage.getItem('access_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        // Load profile
        fetch(`${API_BASE}/profile/`, { headers: getAuthHeaders() })
            .then(r => { if (!r.ok) throw new Error('Unauthorized'); return r.json(); })
            .then(data => {
                document.getElementById('username-display').textContent = data.username;
                document.getElementById('focus-score').textContent = data.focus_score;
                document.getElementById('total-study-time').textContent = data.total_study_time_formatted;
                document.getElementById('streak-days').textContent = data.streak_days + ' days';
            })
            .catch(() => { window.location.href = '/api/docs/'; });

        // Load report
        fetch(`${API_BASE}/reports/study/`, { headers: getAuthHeaders() })
            .then(r => r.json())
            .then(data => {
                const list = document.getElementById('sessions-list');
                data.forEach(session => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                        <span>${new Date(session.start_time).toLocaleString()} (${session.session_type})</span>
                        <span>
                            <span class="badge bg-primary">${session.duration}</span>
                            <span class="badge bg-warning">${session.distractions_count} distractions</span>
                        </span>
                    `;
                    list.appendChild(li);
                });
            });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            const refreshToken = localStorage.getItem('refresh_token');
            fetch(`${API_BASE}/auth/logout/`, {
                method: 'POST',
                headers: { ...getAuthHeaders(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh: refreshToken })
            }).finally(() => {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/api/docs/';
            });
        });
    </script>
</body>
</html>
