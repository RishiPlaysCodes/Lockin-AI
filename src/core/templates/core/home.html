{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Guardian AI - Sign in</title>
    <meta name="description" content="Focus Guardian AI - Stay focused, study smarter with AI-powered coaching.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-logo">&#9673;</span>
            </div>
            <h1 class="auth-title">Focus Guardian AI</h1>
            <p class="auth-sub">Stay focused. Study smarter.</p>

            <div class="tabs" role="tablist">
                <button class="tab active" id="tab-login" type="button" onclick="switchTab('login')">Sign in</button>
                <button class="tab" id="tab-signup" type="button" onclick="switchTab('signup')">Create account</button>
            </div>

            <div id="message" class="alert hidden" role="alert"></div>

            <!-- LOGIN -->
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username</label>
                    <input class="form-input" type="text" id="login-username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input class="form-input" type="password" id="login-password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
            </form>

            <!-- SIGNUP -->
            <form id="signup-form" class="hidden" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="signup-username">Username</label>
                    <input class="form-input" type="text" id="signup-username" name="username" autocomplete="username" required minlength="3">
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-email">Email</label>
                    <input class="form-input" type="email" id="signup-email" name="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <input class="form-input" type="password" id="signup-password" name="new-password" autocomplete="new-password" required minlength="10">
                    <div class="form-hint">At least 10 characters, not entirely numeric.</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-password2">Confirm password</label>
                    <input class="form-input" type="password" id="signup-password2" name="confirm-password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="signup-btn">Create account</button>
            </form>
        </div>
    </div>

    <script src="{% static 'core/js/app.js' %}"></script>
    <script>
        // Already logged in? Go to dashboard.
        if (FG.Auth.isAuthenticated()) {
            window.location.replace("/dashboard/");
        }

        const msgEl = document.getElementById("message");
        function showMessage(text, type) {
            msgEl.textContent = text;
            msgEl.className = "alert alert-" + (type === "success" ? "success" : "danger");
        }
        function hideMessage() { msgEl.className = "alert hidden"; }

        function switchTab(tab) {
            const isLogin = tab === "login";
            document.getElementById("tab-login").classList.toggle("active", isLogin);
            document.getElementById("tab-signup").classList.toggle("active", !isLogin);
            document.getElementById("login-form").classList.toggle("hidden", !isLogin);
            document.getElementById("signup-form").classList.toggle("hidden", isLogin);
            hideMessage();
        }

        function setLoading(btn, loading, label) {
            btn.disabled = loading;
            btn.innerHTML = loading ? '<span class="spinner"></span>' : label;
        }

        // LOGIN
        document.getElementById("login-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            hideMessage();
            const btn = document.getElementById("login-btn");
            setLoading(btn, true);
            const res = await FG.apiFetch("/auth/token/", {
                method: "POST",
                body: JSON.stringify({
                    username: document.getElementById("login-username").value.trim(),
                    password: document.getElementById("login-password").value,
                }),
            });
            if (res.ok && res.data && res.data.access) {
                FG.Auth.setTokens(res.data.access, res.data.refresh);
                window.location.replace("/dashboard/");
            } else {
                showMessage(res.status === 401 ? "Invalid username or password." : FG.extractError(res.data, "Sign in failed."), "danger");
                setLoading(btn, false, "Sign in");
            }
        });

        // SIGNUP
        document.getElementById("signup-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            hideMessage();
            const pass = document.getElementById("signup-password").value;
            const pass2 = document.getElementById("signup-password2").value;
            if (pass !== pass2) { showMessage("Passwords do not match.", "danger"); return; }

            const btn = document.getElementById("signup-btn");
            setLoading(btn, true);
            const res = await FG.apiFetch("/auth/register/", {
                method: "POST",
                body: JSON.stringify({
                    username: document.getElementById("signup-username").value.trim(),
                    email: document.getElementById("signup-email").value.trim(),
                    password: pass,
                    password_confirm: pass2,
                }),
            });
            if (res.ok && res.data && res.data.tokens) {
                FG.Auth.setTokens(res.data.tokens.access, res.data.tokens.refresh);
                window.location.replace("/dashboard/");
            } else {
                showMessage(FG.extractError(res.data, "Could not create account."), "danger");
                setLoading(btn, false, "Create account");
            }
        });
    </script>
</body>
</html>
