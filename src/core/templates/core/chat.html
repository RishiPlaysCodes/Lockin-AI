<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teacher Chat - Focus Guardian AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1WiQDTl9EI0FGFmPicF/X6s4nkjZPE" crossorigin="anonymous">
    <style>
        #chat-box {
            height: 450px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        .message { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user-message { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai-message { background: #f1f3f5; color: #333; }
        .typing-indicator { color: #6c757d; font-style: italic; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 700px;">
        <h2 class="text-center mb-4">AI Study Teacher</h2>
        <div id="chat-box" class="mb-3">
            <div class="message ai-message">Hello! I'm your Focus Guardian AI Teacher. Ask me anything - study tips, concept explanations, or just need motivation!</div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" class="form-control" placeholder="Ask a question..." maxlength="2000">
            <button id="send-btn" class="btn btn-primary">Send</button>
        </div>
        <div class="mt-3 text-center">
            <a href="/dashboard/" class="btn btn-link">Back to Dashboard</a>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        function getAuthHeaders() {
            const token = localStorage.getItem('access_token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'message ai-message typing-indicator';
            div.textContent = 'Thinking...';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, true);
            userInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch(`${API_BASE}/ai-teacher/`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                removeTyping();

                if (data.reply) {
                    appendMessage(data.reply, false);
                } else if (data.error) {
                    appendMessage(`Error: ${data.error.message || data.error}`, false);
                }
            } catch (err) {
                removeTyping();
                appendMessage('Failed to connect. Please try again.', false);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
