{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teacher - Focus Guardian AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
</head>
<body>
    <div class="app-shell">
        <nav class="navbar">
            <a href="/dashboard/" class="brand">
                <span class="brand-logo">&#9673;</span>
                Focus Guardian AI
            </a>
            <div class="nav-right">
                <a href="/dashboard/" class="btn btn-ghost">&#8592; Dashboard</a>
            </div>
        </nav>

        <main class="container-app">
            <div class="flex items-center gap-3 mb-4">
                <div class="stat-icon" style="background: var(--primary-soft); color:#a5b4fc; margin:0;">&#129302;</div>
                <div>
                    <h1 class="page-title" style="margin:0;">AI Study Teacher</h1>
                    <p class="text-muted" style="font-size:0.88rem;">Ask for explanations, study tips, or motivation.</p>
                </div>
            </div>

            <div class="chat-shell">
                <div class="chat-box" id="chat-box">
                    <div class="msg msg-ai">Hi! I'm your Focus Guardian AI Teacher. Ask me anything — I can explain concepts, share study techniques, or help you stay motivated.</div>
                </div>
                <div class="chat-input-row">
                    <input class="form-input" id="user-input" type="text" placeholder="Type your question..." maxlength="2000" autocomplete="off">
                    <button class="btn btn-primary" id="send-btn">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script src="{% static 'core/js/app.js' %}"></script>
    <script>
        if (!FG.Auth.requireAuth()) { /* redirected */ }

        const chatBox = document.getElementById("chat-box");
        const input = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function addMessage(text, who) {
            const div = document.createElement("div");
            div.className = "msg " + (who === "user" ? "msg-user" : "msg-ai");
            div.textContent = text; // XSS-safe
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement("div");
            div.className = "msg msg-typing";
            div.id = "typing";
            div.textContent = "AI Teacher is typing...";
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }

        async function send() {
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            input.disabled = true;
            sendBtn.disabled = true;
            showTyping();

            const res = await FG.apiFetch("/ai-teacher/", {
                method: "POST",
                body: JSON.stringify({ message }),
            });
            removeTyping();

            if (res.ok && res.data && res.data.reply) {
                addMessage(res.data.reply, "ai");
            } else if (res.status === 429) {
                addMessage("You're sending messages too quickly. Please wait a moment and try again.", "ai");
            } else {
                addMessage(FG.extractError(res.data, "Sorry, I couldn't respond right now. Please try again."), "ai");
            }

            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }

        sendBtn.addEventListener("click", send);
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
        input.focus();
    </script>
</body>
</html>
