<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer - Focus Guardian AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1WiQDTl9EI0FGFmPicF/X6s4nkjZPE" crossorigin="anonymous">
    <style>
        .timer-display { font-size: 5rem; font-weight: bold; font-family: 'Courier New', monospace; }
        #distraction-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 2rem;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-light">
    <div id="distraction-overlay">
        <h1>STAY FOCUSED!</h1>
        <p>Get back to work - you've got this!</p>
    </div>

    <div class="container text-center mt-5">
        <h1 class="mb-4">Focus Session</h1>
        <div class="timer-display my-4" id="timer">25:00</div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-success btn-lg me-2">Start</button>
            <button id="stop-btn" class="btn btn-danger btn-lg" disabled>End Session</button>
        </div>

        <div class="mt-4">
            <h5>Simulate Distraction (for testing)</h5>
            <button id="simulate-distraction" class="btn btn-warning btn-sm">Switch App (Simulate)</button>
        </div>
        
        <div class="mt-3">
            <a href="/dashboard/" class="btn btn-link">Back to Dashboard</a>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        // Auth guard: redirect to login if no token
        if (!localStorage.getItem('access_token')) {
            window.location.href = '/';
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('access_token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        let timeLeft = 25 * 60;
        let timerInterval = null;
        let sessionActive = false;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        startBtn.addEventListener('click', () => {
            fetch(`${API_BASE}/sessions/start/`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ session_type: 'pomodoro', planned_duration_minutes: 25 })
            })
            .then(r => r.json())
            .then(data => {
                if (data.id) {
                    sessionActive = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    timerInterval = setInterval(() => {
                        if (timeLeft > 0) {
                            timeLeft--;
                            updateTimer();
                        } else {
                            clearInterval(timerInterval);
                            document.getElementById('stop-btn').click();
                        }
                    }, 1000);
                }
            });
        });

        stopBtn.addEventListener('click', () => {
            fetch(`${API_BASE}/sessions/end/`, {
                method: 'POST',
                headers: getAuthHeaders()
            })
            .then(() => {
                clearInterval(timerInterval);
                sessionActive = false;
                window.location.href = '/dashboard/';
            });
        });

        document.getElementById('simulate-distraction').addEventListener('click', () => {
            if (!sessionActive) return;
            
            const overlay = document.getElementById('distraction-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.display = 'none'; }, 2000);

            fetch(`${API_BASE}/distractions/`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ app_name: 'Simulated Distraction', distraction_type: 'mock' })
            });
        });

        // Detect tab visibility changes as distractions
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && sessionActive) {
                fetch(`${API_BASE}/distractions/`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ app_name: 'Browser Tab Switch', distraction_type: 'visibility_change' })
                });
            }
        });
    </script>
</body>
</html>
