# ============================================================
# Focus Guardian AI - Render.com Blueprint
# ============================================================
# This file lets you deploy the ENTIRE app (web + database)
# to Render.com with almost no manual configuration.
#
# How to use:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance"
#   4. Connect your GitHub repo
#   5. Render reads this file and sets everything up automatically
#
# No credit card required for the free tier.
# ============================================================

databases:
  - name: focus-guardian-db
    databaseName: focus_guardian
    user: focus_guardian
    plan: free

services:
  - type: web
    name: focus-guardian
    runtime: python
    plan: free
    region: singapore   # Closest to India; change if you prefer (oregon/frankfurt)
    buildCommand: "./build.sh"
    startCommand: "cd src && gunicorn focus_guardian.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: focus_guardian.settings.production
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_SECRET_KEY
        generateValue: true   # Render generates a secure random key
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: focus-guardian-db
          property: connectionString
      - key: DISABLE_COLLECTSTATIC
        value: "0"
      # AI Teacher: Gemini has a FREE tier. Get a key at https://aistudio.google.com/apikey
      # Paste your key in the Render dashboard (Environment tab) - kept secret.
      - key: GEMINI_API_KEY
        sync: false   # You set this manually in dashboard (keeps it secret)
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # OpenAI is optional (paid). Only used if GEMINI_API_KEY is not set.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
