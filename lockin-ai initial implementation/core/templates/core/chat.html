<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teacher Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: white; }
        .message { margin-bottom: 10px; }
        .user-message { text-align: right; color: blue; }
        .ai-message { text-align: left; color: green; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center">Talk to AI Teacher</h2>
        <div id="chat-box" class="mb-3 rounded">
            <div class="message ai-message">Hello! I am your Focus Guardian AI Teacher. How can I help you today?</div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" class="form-control" placeholder="Ask a question or explain a concept...">
            <button id="send-btn" class="btn btn-primary">Send</button>
        </div>
        <div class="mt-3 text-center">
             <a href="/dashboard/" class="btn btn-link">Back to Dashboard</a>
        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user-message' : 'ai-message');
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            const message = userInput.value;
            if (!message) return;

            appendMessage(message, true);
            userInput.value = '';

            fetch('/api/ai-teacher/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({ message: message })
            })
            .then(r => r.json())
            .then(data => {
                if (data.reply) {
                    appendMessage(data.reply, false);
                } else if (data.error) {
                    appendMessage("Error: " + data.error, false);
                }
            });
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
