<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .timer-display { font-size: 5rem; font-weight: bold; }
        #distraction-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,0,0,0.8);
            color: white;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 2rem;
        }
    </style>
</head>
<body class="bg-light">
    <div id="distraction-overlay">
        STAY FOCUSED! GET BACK TO WORK!
    </div>

    <div class="container text-center mt-5">
        <h1>Focus Session</h1>
        <div class="timer-display my-4" id="timer">25:00</div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-success btn-lg">Start</button>
            <button id="stop-btn" class="btn btn-danger btn-lg" disabled>Stop / End Session</button>
        </div>

        <div class="mt-5">
            <h3>Simulate Distraction</h3>
            <button id="simulate-distraction" class="btn btn-warning">Switch App (Simulate)</button>
        </div>
        
        <div class="mt-3">
            <a href="/dashboard/" class="btn btn-link">Back to Dashboard</a>
        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        let timeLeft = 25 * 60;
        let timerInterval = null;
        let sessionId = null;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        startBtn.addEventListener('click', () => {
            fetch('/api/session/start/', { 
                method: 'POST',
                headers: { 'X-CSRFToken': csrftoken }
            })
                .then(r => r.json())
                .then(data => {
                    sessionId = data.id;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    timerInterval = setInterval(() => {
                        if (timeLeft > 0) {
                            timeLeft--;
                            updateTimer();
                        } else {
                            clearInterval(timerInterval);
                            alert("Time is up!");
                        }
                    }, 1000);
                });
        });

        stopBtn.addEventListener('click', () => {
            fetch('/api/session/end/', { 
                method: 'POST',
                headers: { 'X-CSRFToken': csrftoken }
            })
                .then(r => {
                    clearInterval(timerInterval);
                    window.location.href = '/dashboard/';
                });
        });

        document.getElementById('simulate-distraction').addEventListener('click', () => {
            if (!sessionId) return;
            
            const overlay = document.getElementById('distraction-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.display = 'none'; }, 2000);

            fetch('/api/distraction/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({ app_name: 'Simulated Distraction', distraction_type: 'mock' })
            });
        });

        // Simulate page visibility distraction detection
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && sessionId) {
                 fetch('/api/distraction/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ app_name: 'Browser Tab Switch', distraction_type: 'visibility_change' })
                });
            }
        });
    </script>
</body>
</html>
