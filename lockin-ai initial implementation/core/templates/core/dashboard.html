<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Guardian AI - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-top: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Focus Guardian AI</a>
            <span class="navbar-text" id="username-display"></span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Focus Score</h5>
                        <h2 id="focus-score">--</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Total Study Time</h5>
                        <h2 id="total-study-time">--</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="/timer/" class="btn btn-primary btn-lg w-100">Start Focus Session</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12 text-center">
                 <a href="/chat/" class="btn btn-secondary">Talk to AI Teacher</a>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <h3>Recent Study Sessions</h3>
                <ul class="list-group" id="sessions-list">
                </ul>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/profile/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('username-display').textContent = data.username;
                document.getElementById('focus-score').textContent = data.focus_score;
                document.getElementById('total-study-time').textContent = data.total_study_time;
            });

        fetch('/api/report/')
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById('sessions-list');
                data.forEach(session => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    li.textContent = `Start: ${new Date(session.start_time).toLocaleString()} | Duration: ${session.duration} | Distractions: ${session.distractions_count}`;
                    list.appendChild(li);
                });
            });
    </script>
</body>
</html>
